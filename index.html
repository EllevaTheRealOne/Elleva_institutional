<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Elleva | Global Investment Platform</title>
    <meta name="description" content="Elleva is a global investment platform combining research, portfolio intelligence, execution and monitoring in a unified investment experience." />
    <meta name="author" content="Elleva" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://elleva.me/" />

    <!-- Theme & App Metadata -->
    <meta name="theme-color" content="#0C5F5A" />
    <meta name="application-name" content="Elleva" />
    <meta name="apple-mobile-web-app-title" content="Elleva" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elleva" />
    <meta property="og:title" content="Elleva | Global Investment Platform" />
    <meta property="og:description" content="Elleva is a global investment platform combining research, portfolio intelligence, execution and monitoring in a unified investment experience." />
    <meta property="og:url" content="https://elleva.me/" />
    <meta property="og:image" content="https://elleva.me/og-image.png" />
    <meta property="og:image:secure_url" content="https://elleva.me/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Elleva - Global Investment Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elleva | Global Investment Platform" />
    <meta name="twitter:description" content="Elleva is a global investment platform combining research, portfolio intelligence, execution and monitoring in a unified investment experience." />
    <meta name="twitter:image" content="https://elleva.me/og-image.png" />
    <meta name="twitter:image:alt" content="Elleva - Global Investment Platform" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://elleva.me/#organization",
            "name": "Elleva",
            "url": "https://elleva.me/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://elleva.me/android-chrome-512x512.png"
            },
            "description": "Global investment platform combining research, portfolio intelligence, execution and monitoring in a unified investment experience."
          },
          {
            "@type": "WebSite",
            "@id": "https://elleva.me/#website",
            "name": "Elleva",
            "url": "https://elleva.me/",
            "description": "Elleva is a global investment platform combining research, portfolio intelligence, execution and monitoring in a unified investment experience.",
            "publisher": {
              "@id": "https://elleva.me/#organization"
            },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <!-- Google Fonts: Poppins, Inter, Open Sans, Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F7F8F6] text-[#0A0D0C] antialiased selection:bg-[#D9F1EE] selection:text-[#0C5F5A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
